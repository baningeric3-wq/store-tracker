<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Store Inventory & Sales Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header Controls -->
        <div class="header-row">
            <h1>Store Manager Pro</h1>
            <button id="theme-toggle" class="btn-theme">🌙 Dark Mode</button>
        </div>
        
        <!-- Live Analytics Dashboard -->
        <div class="dashboard">
            <div class="stat-card">
                <h3>Total Inventory Value</h3>
                <p id="total-value">$0.00</p>
            </div>
            <div class="stat-card">
                <h3>Total Revenue From Sales</h3>
                <p id="total-sales" style="color: #28a745;">$0.00</p>
            </div>
            <div class="stat-card">
                <h3>Low Stock Alerts</h3>
                <p id="low-stock-count" style="color: #dc3545;">0</p>
            </div>
        </div>

        <!-- System Threshold and CSV Tools -->
        <div class="controls-row">
            <div class="threshold-input">
                <label for="threshold-setting">Low Stock Alert Level: </label>
                <input type="number" id="threshold-setting" value="5" min="1">
            </div>
            <div class="button-group">
                <button id="export-btn" class="btn-secondary">📥 Export Inventory (CSV)</button>
                <button id="clear-data-btn" class="btn-danger">⚠️ Reset System</button>
            </div>
        </div>

        <!-- Dual Input Forms: Products & Point-of-Sale System -->
        <div class="forms-grid">
            <!-- Left Side: Stock Management -->
            <div class="form-section">
                <h2>📦 Add New Product Stock</h2>
                <form id="item-form">
                    <input type="text" id="item-name" placeholder="Item Name (e.g. iPhone 15)" required>
                    <input type="text" id="item-sku" placeholder="SKU / Barcode ID (Optional)">
                    <input type="number" id="item-qty" placeholder="Initial Stock Quantity" required min="0">
                    <input type="number" id="item-price" placeholder="Cost/Retail Price ($)" required min="0" step="0.01">
                    <select id="item-category" required>
                        <option value="" disabled selected>Select Category</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Groceries">Groceries</option>
                        <option value="Clothing">Clothing</option>
                        <option value="Home & Living">Home & Living</option>
                        <option value="Other">Other</option>
                    </select>
                    <button type="submit" class="btn-success">Add to Stock</button>
                </form>
            </div>

            <!-- Right Side: Live Sales Register -->
            <div class="form-section sales-section">
                <h2>💰 Record a Customer Sale</h2>
                <form id="sales-form">
                    <select id="sale-item-select" required>
                        <option value="" disabled selected>Select Item to Sell</option>
                        <!-- Dynamic via JS -->
                    </select>
                    <input type="number" id="sale-qty" placeholder="Quantity Sold" required min="1">
                    <button type="submit" class="btn-primary">Process Checkout Sale</button>
                </form>
            </div>
        </div>

        <!-- Filter and Search Interface -->
        <div class="search-section">
            <input type="text" id="search-input" placeholder="🔍 Search inventory by name or barcode SKU...">
            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Groceries">Groceries</option>
                <option value="Clothing">Clothing</option>
                <option value="Home & Living">Home & Living</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Core Inventory Table -->
        <div class="table-section">
            <h2>Current Live Inventory Ledger</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>SKU / Barcode</th>
                            <th>Category</th>
                            <th>Current Quantity</th>
                            <th>Unit Price</th>
                            <th>Status Badge</th>
                            <th>Action Items</th>
                        </tr>
                    </thead>
                    <tbody id="item-list">
                        <!-- Instantly Loaded via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
